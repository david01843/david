<html lang="en"><!--https://colorscheme.ru/html-colors.html-->
<head><meta charset="UTF-8" name="google" content="notranslate"></head>
<style>
	* {margin: 0; font-family: sans-serif;}
    body {
        display: grid; grid-template-rows: repeat(5, auto) 1fr; grid-gap: 16px;
        margin: 16px; width: calc(100vw - 32px); height: calc(100vh - 32px);
        justify-items: center; background: black;
    }
    input {background: gray;}
    #deck {
        height: 231px; width: fit-content; max-width: calc(100vw - 224px);
        display: flex; flex-direction: column; flex-wrap: wrap; user-select: none;
        align-content: flex-start; align-items: center; overflow-x: scroll;
    }
    #deck::-webkit-scrollbar {height: 8px;}
    #deck::-webkit-scrollbar-thumb {background: #444; border-radius: 4px;}
    #deck::-webkit-scrollbar-track {background: black;}
    #deck p {background: #777; margin: 1px; height: 20px; width: 20px;}
    #deck p.stashed {background: #333;}
    #deck p.dropped {background: #000;}
    #prompt {font-size: 24px; color: #888;}
    #answer {font-size: 24px; color: rgb(160, 200, 255);}
    #controls p {
        color: rgb(160, 200, 255); background: #000; border: solid 2px rgb(160, 200, 255);
        display: inline-block; margin: 0 8px; padding: 4px 8px; font-size: 16px; border-radius: 16px;
    }
    #controls p:hover {cursor: pointer;}
    #controls p:focus {outline: none;}
</style>
<body>
    <input type="file" accept=".ods">
    <div id="controls"><p>Shuffle</p><p>Stash All</p><p>Drop All</p><p>Cut 1/3</p><p>Save</p></div>
    <div id="deck"></div>
    <p id="prompt"></p>
    <p id="answer"></p>
    <a>Save </a>
</body>
<script src="xlsx.full.min.js"></script>
<script>
    const BLUE = "rgb(160, 200, 255)", GREEN = "rgb(110, 255, 150)"
    var dragging = false // click and dragging on cards in deck
    var keeping = false // click and dragging on cards in deck
    var active // p tag
    const audio = new SpeechSynthesisUtterance()
    audio.lang = "ru"
    audio.text = " "
    audio.volume = 0
    speechSynthesis.speak(audio)
    audio.volume = 1
    const inputs = document.querySelectorAll("input")
    const deck = document.querySelector("#deck")
    const prompt = document.querySelector("#prompt")
    const answer = document.querySelector("#answer")
    const controls = document.querySelectorAll("#controls p")

    // add words to deck
    inputs[0].addEventListener("change", (e1) => { // add words
        inputs[0].blur() // release focus
        const file = e1.target.files[0]
        const reader = new FileReader()
        reader.onload = function(e2) {
            const data = new Uint8Array(e2.target.result)
            const wb = XLSX.read(data, { type: 'array' })
            const ws = wb.Sheets[wb.SheetNames[0]]
            const rows = XLSX.utils.sheet_to_json(ws, {header: 1});
            rows.forEach((row, r) => {
                if (row[2] != 0) {
                    let p = document.createElement("p")
                    p.dataset.metadata = row[0]+"|"+row[1]
                    p.addEventListener("mousedown", () => {
                        if (!p.classList.contains("dropped")) {            
                            dragging = true
                            keeping = p.classList.contains("stashed")
                            p.classList.toggle("stashed")
                        }
                    })
                    p.addEventListener("mouseenter", () => {
                        if (dragging && !p.classList.contains("dropped")) {
                            keeping ? p.classList.remove("stashed") : p.classList.add("stashed")
                        } 
                    })
                    deck.appendChild(p)
                }
            })
            cycle()
        }
        reader.readAsArrayBuffer(file)
    })

    // controls
    controls[0].addEventListener("click", () => {
        [...deck.children].forEach(i => {
            i.classList.contains("dropped") ? i.remove() : i.classList.remove("stashed")
        });
        [...deck.children].sort(() => Math.random()-.5).forEach(i => deck.appendChild(i)); cycle()
    })
    controls[1].addEventListener("click", () => {
        [...deck.children].forEach(i => {
            i.classList.contains("dropped") ? i.remove() : i.classList.add("stashed")
        }); cycle()
    })
    controls[2].addEventListener("click", () => {deck.replaceChildren(); cycle()})
    controls[3].addEventListener("click", () => {
        [...deck.children].forEach((c, i) => {if (i%3 == 0) c.remove()}); cycle()
    })
    controls[4].addEventListener("click", () => {
        const rows = [...deck.children]
            .filter(c => !c.classList.contains("dropped"))
            .map(c => [...c.dataset.metadata.split("|"), 1])
            .sort((a, b) => a[0].localeCompare(b[0], "ru"))
        const ws = XLSX.utils.aoa_to_sheet(rows)
        const wb = XLSX.utils.book_new()
        XLSX.utils.book_append_sheet(wb, ws, "Sheet1")
        XLSX.writeFile(wb, "subgroup_study_list.ods", {bookType: "ods"})
    })

    // operation
    function cycle() {
        let c = [...deck.querySelectorAll(":scope > :not(.stashed, .dropped)")]
        c.sort(() => Math.random()-.5)
        if (c.length > 0) {
            active = (c.length > 1 && c[0] == active) ? c[1] : c[0]
            let [ru, en] = active.dataset.metadata.split("|")
            audio.text = ru
            prompt.innerHTML = ru
            answer.dataset.metadata = en
            speechSynthesis.speak(audio)
        } else {
            active = ""
            prompt.innerHTML = ""
            answer.dataset.metadata = ""
        }
        answer.innerHTML = ""
        answer.style.color = BLUE
    }
    window.addEventListener("mouseup", () => {dragging = false})
    window.addEventListener("keydown", (e) => {
        if (e.key == "Enter") {
            if (answer.style.color == GREEN) {cycle()}
            else {answer.innerHTML = answer.dataset.metadata; answer.style.color = GREEN}
        } else if (e.key == "Shift" && answer.style.color == GREEN) {
            active.classList.add("stashed"); cycle()
        } else if (e.key == "ArrowLeft" && answer.style.color == GREEN) {
            active.classList.add("dropped"); cycle()
        } else if (e.key == "ArrowRight") {
            speechSynthesis.cancel(); speechSynthesis.speak(audio)
        }
    })
</script>
</html>

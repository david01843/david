<html lang="en"><!--https://colorscheme.ru/html-colors.html-->
	<head><!--https://dictionaryapi.dev/-->
		<meta charset="UTF-8" name="google" content="notranslate">
	</head>
	<style>
        * {font-family: sans-serif; font-size: 12px;}
        div p {margin: 2px; padding: 0 2em; background: gainsboro;}
        div p:nth-of-type(2) {color: gainsboro;}
        div p:nth-of-type(2):hover {color: black;}
	</style>
	<body>
        <button>wikt api call</button>
        <textarea>hello</textarea>
	</body>
	<script>
        const body = document.querySelector("body")
        const button = document.querySelector("button")
        const ta = document.querySelector("textarea")
        
        async function translate(txt) {
            let url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q="
            let res = await fetch(url+encodeURIComponent(txt))
			let json = await res.json()
			return json[0][0][0]
		}
        async function myprint(txt) {
            let div = document.createElement("div")
            let en = document.createElement("p")
            let ru = document.createElement("p")
            div.append(en, ru)
            en.innerHTML = txt; ru.innerHTML = "-"
            div.addEventListener("mousemove", async () => {
                if (ru.innerHTML == "-") {
                    ru.innerHTML = "translating..."
                    ru.innerHTML = translate(en.innerHTML)
                }
            }) 
            body.appendChild(div)
        }
        button.addEventListener("click", async () => {
            let url = `https://en.wiktionary.org/api/rest_v1/page/definition/${ta.value}`
            let res = await fetch(url)
            let data = await res.json()
            document.querySelectorAll("p").forEach(p => p.remove())
            for (let pos of data["en"]) {
                myprint(`[${pos.partOfSpeech}]`)
                for (let def of pos.definitions) {
                    myprint(def.definition.replace(/<[^>]*>/g, "").trim())
                    let exs = def.examples ?? def.parsedExamples?.map(pe => pe.example) ?? []
                    for (let ex of exs) {
                        myprint(`----${ex.replace(/<[^>]*>/g, "").trim()}`)
                    }
                }
            }
        })
	</script>
</html>

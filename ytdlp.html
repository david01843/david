<html lang="en"><!--https://colorscheme.ru/html-colors.html-->
	<head>
		<meta charset="UTF-8" name="google" content="notranslate">
	</head>
	<style>
		* {margin: 8px; font-family: sans-serif;}
		a {display: block; width: fit-content; font-size: 32px; color: blue;}
		button {padding: 8px 32px; font-size: 32px;}
		p {width: fit-content; font-size: 16px; color: red;}
	</style>
	<body>
        <a>(1st url) List formats, pick, download, move</a>
        <a>(all urls) Download 251/140, move</a>
        <a>Move</a>
        <a>(laptop) Convert</a>
        <button>Paste URL</button>
<!--	Install yt-dlp on Linux Mint:
			sudo apt update && sudo apt upgrade && sudo apt install yt-dlp
		Upgrade yt-dlp on Linux Mint:
			sudo apt update && sudo apt upgrade yt-dlp // if installed with apt
			sudo pip install --upgrade yt-dlp // if installed with pip
			sudo yt-dlp -U // if installed as standalone binary
        Install ffmpeg on Linux Mint:
            sudo apt update && sudo apt install ffmpeg
		Install yt-dlp on Android Termux: 
			pkg update && pkg upgrade && pkg install yt-dlp
		Upgrade yt-dlp on Android Termux:
			pip install --upgrade yt-dlp // if installed with pkg
		    pip3 install --upgrade yt-dlp // if installed with pip3    -->
	</body>
	<script>
        const a = document.querySelectorAll("a")
        a[0].addEventListener("click", () => {
            let url = document.querySelector("p").innerHTML
            let cmd = `yt-dlp --cookies /sdcard/Download/cookies.txt -F "${url}" && read -p "Pick: " x && yt-dlp --cookies /sdcard/Download/cookies.txt -f "$x" "${url}"; mv *.webm *.m4a *.mp4 /sdcard/Download/`
            navigator.clipboard.writeText(cmd)
        })
        a[1].addEventListener("click", (e) => {
            let urls = [...document.querySelectorAll("p")].map(p => `"${p.innerHTML}"`).join(" ")
            let cmd = `for i in ${urls}; do yt-dlp --cookies /sdcard/Download/cookies.txt -f "251/140" "$i"; done; mv *.webm *.m4a *.mp4 /sdcard/Download/`
            navigator.clipboard.writeText(cmd)
        })
        a[2].addEventListener("click", (e) => {
            let cmd = "mv *.webm *.m4a *.mp4 /sdcard/Download/"
            navigator.clipboard.writeText(cmd)
        })
        a[3].addEventListener("click", (e) => {
            let cmd = 'cd /home/david/Desktop/music/; for f in *.webm *.m4a *.mp4; do ffmpeg -i "$f" "${f%.*}.mp3" -loglevel quiet; done'
            navigator.clipboard.writeText(cmd)
        })
        const b = document.querySelector("button")
		b.addEventListener("click", async () => {
			let x = await navigator.clipboard.readText()
			let y = document.createElement("p")
			y.innerHTML = x
			y.addEventListener("click", () => {y.remove()})
			document.body.appendChild(y)
		})
	</script>
</html>

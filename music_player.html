<!DOCTYPE html><!--https://codeshack.io/arrow-symbols/-->
<html lang="en"><!--https://codeshack.io/check-mark-symbols/-->
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		* {margin: 0; font-family: monospace; user-select: none; font-size: 11px;}
		html {background: #222;}
		body {
			display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 207px;
			height: calc(100vh - 4px); gap: 2px; margin: 2px; overflow: hidden;
		}
		body div p {display: inline-block; margin-right: 16px;}
		#category {grid-row: 1; grid-column: 1;}
		#category p {color: #ff0; margin-left: 2px;}
		#control {grid-row: 1; grid-column: 2;}
		#control p:nth-of-type(1) {color: #0ff;}
		#control p:nth-of-type(2) {color: #f44;}
		#control p:nth-of-type(3) {color: silver;}
		#library {grid-row: 2; grid-column: 1; overflow: auto;}
		#library::-webkit-scrollbar {display: none;}
		#library p {padding: 0 2px;}
		#library p.artist {color: #f80;}
		#library p.album {color: #f0f; display: none;}
		#library p.track {color: #0f0; display: none;}
		#playlist {grid-row: 2; grid-column: 2; overflow: auto; white-space: nowrap;}
		#playlist::-webkit-scrollbar {display: none;}
		#playlist p {display: block; width: fit-content;}
	</style>
</head>
<body>
	<div id=category></div>
	<div id=control><p>Shuffle</p><p>Clear</p><p>00:00 00:00</p></div>
	<div id=library></div>
	<div id=playlist></div>
</body>
<script src="__data.js">/*const tags, playlists, playlist_sort*/</script>
<script>
	const path = '/home/david/Desktop/music/music/'
	const divs = document.querySelectorAll('body div')
	const ctrls = document.querySelectorAll('#control p')
	function add_track(t) {
		let u = t.split('|')
		let q = document.createElement('p')
		q.innerHTML = u[1]
		q.dataset.metadata = u[2]
		q.style.color = 'gray'
		q.addEventListener('click', (e) => {
			audio_load(path+u[3])
			e.target.style.color = 'white'
			let p = document.querySelectorAll('#playlist p')
			audio_playing = Array.from(p).indexOf(e.target)
		})
		divs[3].appendChild(q)
	}
	for (let i = 0; i < playlists.length; i++) {
		let p = document.createElement('p')
		p.innerHTML = playlist_names[i]
		p.addEventListener('click', (e) => {
			playlists[i].split(',').map(Number).forEach((j) => {add_track(tags[j])})
		})
		divs[0].appendChild(p)
	}
	const audio = new Audio()
	audio.addEventListener('ended', (e) => {
		let p = document.querySelectorAll('#playlist p')
		let i = Array.from(p).findIndex(q => q.style.color == 'white')
		p[(i+1)%p.length].click()
	})
	audio.addEventListener('timeupdate', () => {
		let mc = String(Math.floor(audio.currentTime/60)).padStart(2, '0')
		let sc = String(Math.floor(audio.currentTime%60)).padStart(2, '0')
		let md = String(Math.floor(audio.duration/60)).padStart(2, '0')
		let sd = String(Math.floor(audio.duration%60)).padStart(2, '0')
		ctrls[2].innerHTML = `${mc}:${sc} ${md}:${sd}`
	})
	function audio_load(url) {
		document.querySelectorAll('#playlist p').forEach((i) => {i.style.color = 'gray'})
		audio.src = url; audio.load(); audio.play()
	}
	function audio_play() {audio.paused ? audio.play() : audio.pause()}
	tags.forEach((t) => {
		let p = document.createElement('p')
		let s = t.split('|')
		p.classList.add(s[0])
		p.innerHTML = s[1]
		p.dataset.metadata = s[2]
		if (s[0] == 'artist') {
			p.addEventListener('click', (e) => {
				ps.forEach(i => {if (!i.classList.contains('artist')) i.style.display = 'none'})
				let i = e.target.dataset.metadata.split(',').map(Number)
				i.forEach(j => {
					ps[j].style.display = 'inline-block'
					let k = ps[j].dataset.metadata.split(',').map(Number)
					k.forEach(l => ps[l].style.display = 'inline-block')
				})
			})
		} else if (s[0] == 'album') {
			p.addEventListener('click', (e) => {
				let i = e.target.dataset.metadata.split(',').map(Number)
				i.forEach(j => {add_track(tags[j])})
			})
		} else { // s[0] == track
			p.addEventListener('click', (e) => {add_track(t)})
		}
		divs[2].appendChild(p)
	})
	const ps = document.querySelectorAll('#library p')
	ctrls[0].addEventListener('click', () => {
		let a = Array.from(divs[3].children)
		a.sort(() => Math.random()-.5).forEach(p => divs[3].appendChild(p))
	})
	ctrls[1].addEventListener('click', () => {divs[3].innerHTML = ''})
	ctrls[2].addEventListener('click', () => {audio_play()})
	const chars = '1234567890qwertyuiopasdfghjklzxcvbnm'
	const codes = [49, 50, 51, 52, 53, 54, 55, 56, 57, 48, 81, 87, 69, 82, 84, 89, 85,
		73, 79, 80, 65, 83, 68, 70, 71, 72, 74, 75, 76, 90, 88, 67, 86, 66, 78, 77]
	var text = '' // search
	var textTimeout = null
	function search(t) {
		for (p of ps) {
			let str = p.innerHTML.toLowerCase().replace(/\s/g, '')
			if (p.classList.contains('artist') && str.includes(text.toLowerCase())) {
				p.style.background = 'navy'
			} else if (p.classList.contains('track') && str.includes(text.toLowerCase())) {
				ps[Number(p.dataset.metadata)].style.background = 'navy'
				p.style.background = 'navy'
			} else {p.style.background = 'none'}
		}
		text = ''
	}
	window.addEventListener('keydown', (e) => {
		if (codes.includes(e.keyCode)) {
			clearTimeout(textTimeout)
			text += chars[codes.indexOf(e.keyCode)]
			textTimeout = setTimeout(search, 800)
		}
	})
</script>
</html>

<html lang="en">
	<head>
		<meta charset="UTF-8" name="google" content="notranslate">
		<style>
			* {margin: 0; user-select: none;}
			body {position: relative; overflow: hidden;}
			canvas {position: absolute; top: 0; left: 0; width: 100%; height: 100%;}
			canvas:nth-child(1) {z-index: 1;}
			canvas:nth-child(2) {z-index: 2;}
			#text {
                position: absolute; z-index: 3; max-width: 384px;
                font-family: sans-serif; font-size: 18px; white-space: pre-wrap;
            }
            #buttons {
                position: absolute; left: 50%; transform: translateX(-50%);
                z-index: 4; display: flex;
            }
            button {height: 20px; width: 24px;}
            button:nth-child(1) {background: black}
            button:nth-child(2) {background: green}
            button:nth-child(3) {background: orange}
            button:nth-child(4) {background: crimson}
		</style>
	</head>
	<body>
        <canvas></canvas><canvas></canvas>
        <p id="text"></p>
        <div id="buttons"><button></button><button></button><button></button><button></button></div>
    </body>
    <script src="html2canvas.min.js"></script>
	<script>
		// variables
        var WIDTH, HEIGHT
		const body = document.querySelector("body")
		const canvas = document.querySelectorAll("canvas")
		const ctx = [canvas[0].getContext("2d"), canvas[1].getContext("2d")]
		const text = document.querySelector("#text")
        const buttons = document.querySelectorAll("button")
        
		var xyd = [0, 0] // set on mousedown
		var xym = [0, 0] // set on mousemove
		var texthistory = ""
        var lastarrowup = Date.now()
        var lastclick = Date.now()
        var marking = false
        var erasing = false
        var color = "black"

        // initiation
        function resize() {
            WIDTH = body.clientWidth; canvas[0].width = WIDTH; canvas[1].width = WIDTH
            canvas[0].style.width = WIDTH+"px"; canvas[1].style.width = WIDTH+"px"
			HEIGHT = body.clientHeight; canvas[0].height = HEIGHT; canvas[1].height = HEIGHT
			canvas[0].style.height = HEIGHT+"px"; canvas[1].style.height = HEIGHT+"px"
			ctx[1].lineCap = "round"
			ctx[1].lineJoin = "round"
        }		
        window.addEventListener("load", resize)
        window.addEventListener("resize", resize)
        body.style.cursor = "crosshair"
        buttons.forEach(b => {
            b.addEventListener("click", (e) => {
                color = getComputedStyle(e.target).backgroundColor
                text.style.color = color
                ctx[1].strokeStyle = color
                ctx[0].fillStyle = `color-mix(in srgb, ${color} 25%, white)`
                e.target.blur()
            })
        })
		
		// typing
		async function translate(t) {
			let x = 0
			for (let i of t.toLowerCase()) {x += 1*(/^[a-z]$/.test(i)); x -= 1*(/^[а-яё]$/.test(i))}
            if (x > 0) x = "translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q="
            else x = "translate_a/single?client=gtx&sl=ru&tl=en&dt=t&q="
			x = await fetch("https://translate.googleapis.com/"+x+encodeURIComponent(t))
			x = await x.json()
			return x[0].map(y => y[0]).join("")
		}
		async function drawtext(t) {
            texthistory = text.innerHTML
            const x = xym[0], y = xym[1]
            const h = text.getBoundingClientRect().height
            let img = await html2canvas(text, {backgroundColor: null})
            ctx[1].drawImage(img, x-1, y-11)
            if (t) {
                text.innerHTML = await translate(text.innerHTML)
                img = await html2canvas(text, {backgroundColor: null})
                ctx[1].drawImage(img, x-1, y+h-12)
            }
		}
		window.addEventListener("keydown", async (e) => {
            if (e.key.length == 1) {
                text.innerHTML += e.key
            } else if (e.key == "Backspace") {
				text.innerHTML = text.innerHTML.slice(0, -1)
			} else if (e.key == "Enter") {
				if (text.innerHTML) await drawtext(e.shiftKey)
                text.innerHTML = ""
			} else if (e.key == "Escape") {
                text.innerHTML = ""
            } else if (e.key == "ArrowUp") {
                text.textContent = (Date.now()-lastarrowup < 200) ? await navigator.clipboard.readText() : texthistory
                lastarrowup = Date.now()
			}
		})
		
		// draw, highlight, erase
        window.addEventListener("wheel", () => {
            body.style.cursor = (body.style.cursor == "text") ? "crosshair" : "text"
        })
		canvas[1].addEventListener("mousedown", (e) => {
			xyd = [e.clientX, e.clientY]
            if (Date.now()-lastclick > 200) {
                marking = true
                ctx[0].globalCompositeOperation = "source-over"
                ctx[0].lineWidth = 2
                ctx[1].globalCompositeOperation = "source-over"
                ctx[1].lineWidth = 2
                //ctx[1].strokeStyle = color
            } else {
                erasing = true
                ctx[0].globalCompositeOperation = "destination-out"
                ctx[0].lineWidth = 32
                ctx[1].globalCompositeOperation = "destination-out"
                ctx[1].lineWidth = 32
            }
            lastclick = Date.now()
		})
		canvas[1].addEventListener("mousemove", (e) => {
			xym = [e.clientX, e.clientY]
			text.style.left = xym[0]-1; text.style.top = xym[1]-10
            if (marking && body.style.cursor == "crosshair" || erasing) {
                ctx[0].beginPath()
                ctx[0].moveTo(xym[0], xym[1])
                ctx[0].lineTo(xym[0]-e.movementX, xym[1]-e.movementY)
				ctx[0].stroke()
                ctx[1].beginPath()
                ctx[1].moveTo(xym[0], xym[1])
                ctx[1].lineTo(xym[0]-e.movementX, xym[1]-e.movementY)
				ctx[1].stroke()
			}
		})
		canvas[1].addEventListener("mouseup", () => {
			if (marking && body.style.cursor == "text") {
				ctx[0].beginPath()
                ctx[0].moveTo(xyd[0]-2, xyd[1]-8)
                ctx[0].lineTo(xym[0]+2, xym[1]-8)
                ctx[0].lineTo(xym[0]+2, xym[1]+8)
                ctx[0].lineTo(xyd[0]-2, xyd[1]+8)
				ctx[0].closePath()
                ctx[0].fillStyle = `color-mix(in srgb, ${color} 25%, white)`
                ctx[0].fill()
			}
            marking = false
            erasing = false
		})
	</script>
</html>

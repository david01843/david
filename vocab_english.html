<html lang="en"><!--https://colorscheme.ru/html-colors.html-->
<head><meta charset="UTF-8" name="google" content="notranslate"></head>
<style>
	* {margin: 0; font-family: sans-serif;}
    body {display: grid; grid-template-columns: 144px 1fr; height: 100vh; overflow: hidden; background: black;}
    #library {width: 128px; overflow-x: hidden; overflow-y: auto; background: #111; padding: 8px;}
    #library::-webkit-scrollbar {display: none;}
    #library p {display: none; color: #999; cursor: pointer; width: fit-content;}
    #library .group {display: block; color: rgb(160, 200, 255)}    
    #library .show {display: block;}
    #main {
        display: grid; grid-template-rows: repeat(4, auto) 1fr auto; align-items: end;
        grid-gap: 16px; justify-items: center; padding: 16px 8px;
    }
    #deck {
        height: 231px; width: fit-content; max-width: calc(100vw - 224px);
        display: flex; flex-direction: column; flex-wrap: wrap; user-select: none;
        align-content: flex-start; align-items: center; overflow-x: scroll;
    }
    #deck::-webkit-scrollbar {height: 8px;}
    #deck::-webkit-scrollbar-thumb {background: #444; border-radius: 4px;}
    #deck::-webkit-scrollbar-track {background: black;}
    #deck p {background: #777; margin: 1px; height: 20px; width: 20px;}
    #deck p.stashed {background: #333;}
    #deck p.dropped {background: #000;}
    #prompt, #answer {font-size: 24px; color: #888; min-height: 28px;}
    #answer {color: rgb(160, 200, 255);} 
    #keyboard div {display: flex;}
    #keyboard div:nth-child(2) {margin-left: 32px;}
    #keyboard div:nth-child(3) {margin-left: 38px;}
    #keyboard div:nth-child(4) {margin-left: 48px;}
    #keyboard div:nth-child(3) p:nth-child(n+1):nth-child(-n+4),
    #keyboard div:nth-child(3) p:nth-child(n+7):nth-child(-n+10) {background: #444;}
    #keyboard p {
        color: #999; background: #222; width: 20px; line-height: 20px; width: 20px; line-height: 20px;
        margin: 1px; text-align: center; font-size: 12px; border-radius: 4px;
    }
    #keyboard .typed {color: #000; background: #aaa !important;} 
    #controls p {
        color: rgb(160, 200, 255); background: #000; border: solid 2px rgb(160, 200, 255);
        display: inline-block; margin: 0 8px; padding: 4px 8px; font-size: 16px; border-radius: 16px;
    }
    #controls p:hover {cursor: pointer;}
    #controls p:focus {aoutline: none;}
    #hints {font-style: italic; color: #555; font-size: 14px; text-align: center;}
</style>
<body>
    <div id="library"></div>
    <div id="main">
        <div id="deck"></div>
        <p id="prompt"></p>
        <p id="answer"></p>
        <div id="keyboard"><div></div><div></div><div></div><div></div></div><!--13-13-11-10-->
        <div id="controls"><p>Shuffle</p><p>Stash All</p><p>Drop All</p><p>Change Mode</p></div>
        <p id="hints"></p>
    </div>
</body>
<script src="vocab_english.js"></script>
<script>
    const BLUE = "rgb(160, 200, 255)", GREEN = "rgb(110, 255, 150)", RED = "rgb(255, 130, 110)"
    var dragging = false // click and dragging on cards in deck
    var keeping = false // click and dragging on cards in deck
    var shift = 0 // shift key
    var ctrl = false // control key
    var active // p tag
    var prompt_data
    var prompt_i = 0
    const audio = new SpeechSynthesisUtterance()
        audio.lang = "en"
    var mode = false // ru to en false, en to ru true
    const chars = ["`1234567890-=qwertyuiop[]\\asdfghjkl;'zxcvbnm,./",
        '~!@#$%^&*()_+QWERTYUIOP{}|ASDFGHJKL:"ZXCVBNM<>?']
    const codes = [192, 49, 50, 51, 52, 53, 54, 55, 56, 57, 48, 189, 187,
        81, 87, 69, 82, 84, 89, 85, 73, 79, 80, 219, 221, 220,
        65, 83, 68, 70, 71, 72, 74, 75, 76, 186, 222,
        90, 88, 67, 86, 66, 78, 77, 188, 190, 191]
    const library = document.querySelector("#library")
    const deck = document.querySelector("#deck")
    const prompt = document.querySelector("#prompt")
    const answer = document.querySelector("#answer")
    const keyboard = document.querySelector("#keyboard")
    const keyrows = document.querySelectorAll("#keyboard div")
        for (let i = 0; i < 13; i++) {keyrows[0].appendChild(document.createElement("p"))}
        for (let i = 0; i < 13; i++) {keyrows[1].appendChild(document.createElement("p"))}
        for (let i = 0; i < 11; i++) {keyrows[2].appendChild(document.createElement("p"))}
        for (let i = 0; i < 10; i++) {keyrows[3].appendChild(document.createElement("p"))}
    const keys = document.querySelectorAll("#keyboard div p")
    const controls = document.querySelectorAll("#controls p")
    const hints = document.querySelector("#hints")
    
    // library init
    function add_to_deck(gl) {
        for (let w of Object.keys(data[gl])) {
            let p = document.createElement("p")
            p.dataset.metadata = gl+"||"+w
            p.addEventListener("mousedown", () => {
                if (!p.classList.contains("dropped")) {            
                    dragging = true
                    keeping = p.classList.contains("stashed")
                    p.classList.toggle("stashed")
                }
            })
            p.addEventListener("mouseenter", () => {
                if (dragging && !p.classList.contains("dropped")) {
                    keeping ? p.classList.remove("stashed") : p.classList.add("stashed")
                } 
            })
            deck.appendChild(p)
        }
    }
    let g = document.createElement("p"), i = 0
    Object.keys(data).sort().forEach(gl => {
        if (g.innerHTML != gl.split("|")[0]) {
            g = document.createElement("p")
            g.innerHTML = gl.split("|")[0]
            g.classList.add("group")
            g.dataset.metadata = ""
            g.addEventListener("click", (e) => {
                let ls = document.querySelectorAll("#library p")
                ls.forEach(l => {l.classList.remove("show")})
                e.target.dataset.metadata.split(',').map(Number).forEach(i => {
                    ls[i].classList.add("show")
                })
            })
            library.appendChild(g)
            i++
        }
        g.dataset.metadata += `${i},`
        let l = document.createElement("p")
        l.innerHTML = gl.split("|")[1]
        l.dataset.metadata = gl
        l.addEventListener("click", () => {add_to_deck(l.dataset.metadata)})
        library.appendChild(l)
        i++
    })

    // keyboard init
    function label_keys() {keys.forEach((k, i) => {k.innerHTML = chars[shift][i]})}
    label_keys()

    // controls init
    controls[0].addEventListener("click", () => {
        [...deck.children].forEach(i => {
            i.classList.contains("dropped") ? i.remove() : i.classList.remove("stashed")
        });
        [...deck.children].sort(() => Math.random()-.5).forEach(i => deck.appendChild(i))
    })
    controls[1].addEventListener("click", () => {
        [...deck.children].forEach(i => {
            i.classList.contains("dropped") ? i.remove() : i.classList.remove("stashed")
        })
    })
    controls[2].addEventListener("click", () => {deck.replaceChildren()})
    function write_hints() {
        hints.innerHTML = "[Enter] to show or keep card.<br>[Shift+Enter] to stash card.<br>[Ctrl+Enter] to drop card.<br>Click and drag cards to keep or stash them.<br>[RightArrow] to play audio."
        if (mode) hints.innerHTML += "<br>[UpArrow, DownArrow] to rotate definitions."
    }
    write_hints()
    controls[3].addEventListener("click", () => {
        mode = !mode
        keyboard.style.visibility = mode ? "hidden" : "visible"
        write_hints()
        cycle()
    })

    // operation
    function cycle() {
        let c = [...deck.querySelectorAll(":scope > :not(.stashed, .dropped)")]
        c.sort(() => Math.random()-.5)
        if (c.length > 0) {
            active = (c.length > 1 && c[0] == active) ? c[1] : c[0]
            let [gl, w] = active.dataset.metadata.split("||")
            if (mode) { // ru to en
                prompt_data = data[gl][w].sort(() => Math.random()-.5)
                prompt_i = 0
                prompt.innerHTML = prompt_data[0]
            } else { // en to ru
                prompt.innerHTML = w
            }
            audio.text = w
        } else {
            active = ""
            prompt.innerHTML = ""
            audio.text = ""
        }
        answer.innerHTML = ""
        answer.style.color = BLUE
    }
    function check() {
        if (mode) { // ru to en
            let w = active.dataset.metadata.split("||")[1]
            if (answer.innerHTML == w) {
			    answer.style.color = GREEN
		    } else if (answer.innerHTML != w.slice(0, answer.innerHTML.length)) {
			    answer.style.color = RED
		    } else {
			    answer.style.color = BLUE
		    }
        } else { // en to ru
            answer.style.color = (answer.innerHTML == "") ? BLUE : GREEN
        }
	}
    window.addEventListener("mouseup", () => {dragging = false})
    window.addEventListener("keyup", (e) => {
        if (e.key == "Shift") {shift = 0; label_keys()}
        else if (e.key == "Control") {ctrl = false}
    })
    window.addEventListener("keydown", (e) => {
        if (mode) { // ru to en
            if (e.key == "Shift") {
                shift = 1; label_keys()
            } else if (e.key == "Control") {
                control = true
            } else if (e.key == "Backspace") {
                answer.innerHTML = answer.innerHTML.slice(0, -1); check()
            } else if (e.key == "ArrowUp") {
                prompt_i = (prompt_i+1)%prompt.data.length
                prompt.innerHTML = prompt_data[prompt_i]
            } else if (e.key == "ArrowDown") {
                prompt_i = (prompt_i+prompt.data.length-1)%prompt.data.length
                prompt.innerHTML = prompt_data[prompt_i]
            } else {
                let k = codes.indexOf(e.keyCode)
                if (k != -1) {
                    answer.innerHTML += chars[shift][k]; check(); keys[k].classList.add("typed")
                    setTimeout(() => {keys[k].classList.remove("typed")}, 300)
                }
            }
        }
        if (e.key == "Enter") {
            let [gl, w] = active.dataset.metadata.split("||")
            if (answer.style.color != GREEN) {
                answer.innerHTML = mode ? w : data[gl][w].join("<br>")
                answer.style.color = GREEN
            } else if (shift) {active.classList.add("stashed"); cycle()}
            else if (ctrl) {active.classList.add("dropped"); cycle()}
            else {cycle()}
        }
    })
</script>
</html>
